name: CI · 语法 / 单元 / 档期一致性

# 本仓库此前零自动化测试，README 与 cron 的时间漂移、以及任何语法错误都无人拦截。
# 这个门禁只读，不改数据、不推送飞书。
#
# 关于 main 分支：原先只对非 main 分支的 push 生效，而本仓库的代码改动往往是直接
# 提交到 main（含 bot 提交），等于 main 上的代码零校验 —— 2026-11-14 的可靠性修复
# 推送后 CI 根本没有运行。现改为按路径触发：只改了 docs/data 与 .push-state 的
# 每日数据提交不会触发，而 src / scripts / tests / config 等变更一定会跑门禁。
on:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 安装校验依赖
        run: python -m pip install -q "PyYAML>=6.0,<7"

      - name: 语法编译检查
        run: python -m compileall -q src scripts

      - name: 工作流配置解析
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = sorted(glob.glob('.github/workflows/*.yml')) + ['.github/dependabot.yml']
          assert files, '没有找到任何工作流文件'
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: 单元测试（含 README / cron 档期一致性）
        run: python -m unittest discover -s tests -v

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"

      # workflow_dispatch 的 inputs 只经 env 传入 shell。直接插值进 run 脚本时，
      # 一旦某个 input 改成自由文本（或有人通过 API 绕过 choice 校验）就是命令注入。
      - name: Workflow 输入注入检查
        run: |
          python - <<'PY'
          import glob
          import yaml

          bad = []
          needle = chr(36) + "{{ inputs."
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as fh:
                  doc = yaml.safe_load(fh)
              for job in (doc.get('jobs') or {}).values():
                  for step in job.get('steps', []):
                      if needle in (step.get('run') or ''):
                          bad.append(f"{path}: {step.get('name', '(未命名步骤)')}")
          if bad:
              for item in bad:
                  print(f"::error::{item} 把 inputs 直接插入了 run 脚本")
              raise SystemExit(1)
          print('未发现 workflow inputs 源码插值')
          PY
