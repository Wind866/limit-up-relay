name: 数据源健康自检

# 只读探测全部已接入接口，不写 latest.json、不推飞书、不产生交易信号。
# 手动：Actions → 数据源健康自检 → Run workflow
# 自动：每周一北京时间 07:13（UTC 周日 23:13）体检一次，结果写入 Run Summary。
on:
  schedule:
    - cron: '13 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 逐项探测多个外部接口；不设上限时 job 会吃掉默认的 360 分钟额度。
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 逐项探测并生成报告
        run: |
          python src/check_sources.py --markdown --out docs/data/sources.json >> "$GITHUB_STEP_SUMMARY"

      - name: 保存检查结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-health
          path: docs/data/sources.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 数据源健康自检任务运行失败，请查看日志" --run-url "$RUN_URL" \
            || { echo "::error::告警发送失败（独立告警通道可能也失效）"; exit 1; }

      # job 被整体取消（timeout / 手动 cancel）时状态是 cancelled，failure() 不会触发。
      - name: 超时 / 取消兜底告警
        if: always() && job.status == 'cancelled'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 数据源健康自检 job 被取消或超时（failure() 告警不会触发）" --run-url "$RUN_URL" \
            || { echo "::error::告警发送失败（独立告警通道可能也失效）"; exit 1; }
