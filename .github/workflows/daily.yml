name: 每日涨停接力策略

# 北京时间 = UTC+8。每个交易日跑两次，两次都会推送飞书：
#   13:07 盘中实时快照（UTC 05:07）→ 观察盘中封板与资金变化
#   15:37 收盘定稿（UTC 07:37）→ 次日接力观察池正式版
# 分钟数刻意避开 :00 / :30 —— 整点是 GitHub 调度器最拥堵的时刻。
# 准点由 Cloudflare Worker（见 BIGApush/cloudflare/README.md）workflow_dispatch；
# 下面的 cron 只作兜底。两个档期靠 EXPECT_HHMM 区分，台账守卫按「日期-slot」判重。
on:
  schedule:
    - cron: '7 5 * * 1-5'    # 周一至周五 13:07 北京时间（盘中快照）
    - cron: '37 7 * * 1-5'   # 周一至周五 15:37 北京时间（收盘定稿）
    # 兜底补档：同账号实测 schedule 常迟到 3.3~9.7 小时、甚至整档丢弃。
    # 全部补档映射到同一个 EXPECT_HHMM / 台账 slot，主档成功推送后会被
    # 幂等守卫秒级跳过，不会重复刷屏。旧版只铺到 +1h，真正会跑的时刻
    # （+3~9h）没有任何 cron 档位，等于 Worker 一失效就整档丢失。
    - cron: '7 6 * * 1-5'    # 14:07 → 补 13:07 盘中档
    - cron: '37 8 * * 1-5'   # 16:37 → 补 15:37 收盘档
    - cron: '7 8 * * 1-5'    # 16:07 → 补 13:07 盘中档  (+3h)
    - cron: '37 10 * * 1-5'  # 18:37 → 补 15:37 收盘档  (+3h)
    - cron: '37 14 * * 1-5'  # 22:37 → 补 15:37 收盘档  (+7h)
  # 注意：用 GITHUB_TOKEN 提交的 commit 不会再触发工作流，因此本仓库 bot 的
  # 每日快照提交不会走这条兜底；它只对人工 / 外部推送的 docs/data 变更生效。
  # 「真漏跑时不会有数据提交」—— 所以漏跑补推不能依赖 push 事件，
  # 准点由 Cloudflare Worker 负责，事后核对由档期对账任务负责。
  push:
    branches: [main]
    paths:
      - 'docs/data/**'
      - 'data/snapshots/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: false
        default: close
        type: choice
        options:
          - close
          - demo
      force:
        description: '跳过交易日检查 / 本档期已推过也强制再推'
        required: false
        default: false
        type: boolean
      push:
        description: 推送飞书
        required: false
        default: true
        type: boolean
      expect_hhmm:
        description: '本档期 HHMM（由 Cloudflare Worker 传入：1307 / 1537；留空则按当前时间推断）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: relay-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      # 未启用 Pages 时 deploy 步骤会被跳过，此处回落到推导地址，避免空 url 报错
      url: ${{ steps.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      # Pages 只是看板，不该阻断飞书推送：未启用时跳过部署，流程继续。
      # 之前这里只打 warning，后面的 configure-pages 仍然会失败，等于没做到「非阻断」。
      - name: 检查 Pages 是否已启用
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages") || code="000"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，继续部署"
          elif [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages 未启用，本次跳过部署（不阻断飞书推送）。请到 Settings → Pages → Source 选择「GitHub Actions」。"
          else
            # 无法确认时按「已启用」处理：让 configure-pages 自己报错，避免误判成未启用而长期不部署
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::warning::无法确认 Pages 状态（HTTP $code），继续尝试部署"
          fi

      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 推导看板地址
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          if [ -z "$PAGES_URL" ]; then
            echo "PAGES_URL=$DEFAULT_URL" >> "$GITHUB_ENV"
          fi
          echo "看板地址：${PAGES_URL:-$DEFAULT_URL}"
        env:
          PAGES_URL: ${{ secrets.PAGES_URL }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # 把档期对应的计划时刻写进环境变量，供脚本做延迟标注与双档判重。
      # 优先级：外部 Worker 显式传入的 expect_hhmm > schedule 的 cron 字符串 >
      # 按当前北京时间取最接近的档期（仅手动 dispatch 且没传档期号时的兜底）。
      - name: 推导计划时刻（档期 / 延迟标注）
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          # Worker 显式传入的档期号。inputs 一律经 env 传入，不插进 run 脚本。
          SLOT_HHMM: ${{ inputs.expect_hhmm }}
        run: |
          planned=""
          case "$SCHEDULE" in
            '37 7 * * 1-5'|'37 8 * * 1-5'|'37 10 * * 1-5'|'37 14 * * 1-5') planned="1537" ;;
            '7 5 * * 1-5'|'7 6 * * 1-5'|'7 8 * * 1-5')  planned="1307" ;;
          esac
          # 外部调度器显式带的档期优先。旧版遇到 workflow_dispatch 只能按当前
          # 北京时间猜「最接近的档期」：Actions 排队到 14:22 之后就会把 13:07
          # 的盘中快照记成 1537，台账随后把真正的收盘定稿判重跳过（静默漏推）。
          if [ -n "$SLOT_HHMM" ]; then
            case "$SLOT_HHMM" in
              1307|1537) planned="$SLOT_HHMM" ;;
              *) echo "::warning::非法 expect_hhmm 输入 '$SLOT_HHMM'，忽略" ;;
            esac
          fi
          if [ -z "$planned" ] && [ "$EVENT" != "schedule" ]; then
            planned=$(python -c "from datetime import datetime,timezone,timedelta; n=datetime.now(timezone(timedelta(hours=8))); c=n.hour*60+n.minute; print(min(('1307','1537'), key=lambda s: abs(c-int(s[:2])*60-int(s[2:]))))")
          fi
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"
          if [ -n "$planned" ]; then
            echo "计划时刻：${planned:0:2}:${planned:2} —— 档期守卫已启用"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::error::cron「$SCHEDULE」在本步骤没有对应时刻，双档判重会失效。请同步 on.schedule 与这里的分支。"
            exit 1
          else
            echo "计划时刻：（$EVENT 触发，不做延迟判定）"
          fi

      - name: 运行策略（采集 / 复盘 / 评分 / 推送）
        id: strategy
        if: github.event_name != 'push'   # push 触发时数据刚提交过，只负责部署
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PYTHONIOENCODING: utf-8
          # workflow_dispatch 的 inputs 只经 env 传入 shell，绝不直接插值进 run:
          # 一旦某个 input 改成自由文本（或有人通过 API 绕过 choice 校验），
          # 直接拼接就变成命令注入。
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          ARGS=""
          if [ "$INPUT_MODE" = "demo" ]; then ARGS="--demo"; fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$INPUT_PUSH" = "false" ]; then ARGS="$ARGS --no-push"; fi
          python src/run_daily.py $ARGS

      # 台账（.push-state）与数据快照必须在**同一次**提交里推上去：
      # 旧版用 Contents API 单独提交台账，会抢先把远端 HEAD 推到前面，
      # 导致紧接着的 git push 变成 non-fast-forward 被拒，进而 Pages 部署被 skip。
      - name: 提交每日快照
        if: github.event_name != 'push'   # 防止「提交→触发→再提交」死循环
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/snapshots .push-state
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日策略快照 $(date +'%F %H:%M')"
          # 外部提交（keep-alive / 人工 / dependabot）可能已推进远端，先 rebase 再推。
          # 生成类文件冲突不常见（同一时间只有一次 daily 运行），真冲突时如实失败并告警。
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::推送失败（第 $i 次），尝试 rebase 后重试"
            git pull --rebase --autostash origin "$BRANCH" || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 2))
          done
          echo "::error::连续 3 次推送失败，数据与台账未入库"
          exit 1

      - name: 配置 GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 上传 Pages 产物
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: 部署 Pages
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # 业务级失败（数据源降级、飞书漏推）过去被 return 0 吞掉，工作流显示 success，
      # failure() 告警不触发。放在 Pages 部署之后：看板照常更新，最后一步判红并告警。
      - name: 业务健康检查（降级 / 漏推不可静默）
        if: always() && github.event_name != 'push'
        env:
          BUSINESS_OK: ${{ steps.strategy.outputs.business_ok }}
          BUSINESS_ISSUE: ${{ steps.strategy.outputs.business_issue }}
          STRATEGY_RESULT: ${{ steps.strategy.outcome }}
        run: |
          if [ "$STRATEGY_RESULT" != "success" ]; then
            echo "::error::策略脚本执行失败（$STRATEGY_RESULT），详见上方日志"
            exit 1
          fi
          if [ "$BUSINESS_OK" = "false" ]; then
            echo "::error::业务级失败：${BUSINESS_ISSUE:-数据源降级或飞书未推送成功}"
            exit 1
          fi
          echo "业务健康检查通过"

      # 告警必须支持加签：飞书机器人开启「加签」后，未带 sign 的消息会被直接拒（19021），
      # 原来裸 curl 发文本等于告警永久哑掉。这里改用 scripts/alert.py 复用签名逻辑。
      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/alert.py "⚠️ 涨停接力任务运行失败，请查看日志" --run-url "$RUN_URL" \
            || echo "::error::告警发送失败（独立告警通道可能也失效）"
