name: 每日涨停接力策略

# 北京时间 = UTC+8。每个交易日跑两次，两次都会推送飞书：
#   13:07 盘中实时快照（UTC 05:07）→ 观察盘中封板与资金变化
#   15:37 收盘定稿（UTC 07:37）→ 次日接力观察池正式版
# 分钟数刻意避开 :00 / :30 —— 整点是 GitHub 调度器最拥堵的时刻，实测延迟更大。
# GitHub Actions cron 使用 UTC，官方只保证"尽力而为"：延迟可达数小时，
# 因此脚本内置延迟守卫（EXPECT_HHMM）：延迟 ≥20 分钟会在卡片标注，
# 盘中快照延迟 ≥90 分钟则只更新看板、不推飞书。时间敏感场景建议改用外部定时器触发。
on:
  schedule:
    - cron: '7 5 * * 1-5'    # 周一至周五 13:07 北京时间（盘中快照）
    - cron: '37 7 * * 1-5'   # 周一至周五 15:37 北京时间（收盘定稿）
  # 兜底：定时漏跑时，只要数据提交进仓库，就重新部署看板（不重复推飞书、不再提交）
  push:
    branches: [main]
    paths:
      - 'docs/data/**'
      - 'data/snapshots/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: false
        default: close
        type: choice
        options:
          - close
          - demo
      force:
        description: 跳过交易日检查（节假日补跑时用）
        required: false
        default: false
        type: boolean
      push:
        description: 推送飞书
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: relay-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 站点未启用时提前失败并给出中文指引，避免白跑一遍采集与推送。
      # 该 action 的自动启用参数需要额外 PAT，默认 GITHUB_TOKEN 权限不足。
      - name: 检查 Pages 是否已启用
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages") || code="000"
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages 未启用。请到仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」，然后重新运行本工作流。"
            exit 1
          fi
          if [ "$code" = "200" ]; then
            echo "Pages 已启用，继续部署"
          else
            echo "::warning::无法确认 Pages 状态（HTTP $code），继续尝试部署"
          fi

      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 推导看板地址
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          if [ -z "$PAGES_URL" ]; then
            echo "PAGES_URL=$DEFAULT_URL" >> "$GITHUB_ENV"
          fi
          echo "看板地址：${PAGES_URL:-$DEFAULT_URL}"
        env:
          PAGES_URL: ${{ secrets.PAGES_URL }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # 把 cron 对应的计划时刻写进环境变量，供脚本做延迟守卫。
      # 注意：写进 $GITHUB_ENV 的值在本步骤内读不到（只对后续步骤生效），
      # 所以这里用 shell 变量 planned 中转，不能直接 echo ${EXPECT_HHMM}。
      # 若 schedule 触发但 cron 对不上（改了 on.schedule 忘了改这里），
      # 直接 ::error:: 失败——否则守卫会静默失效，和之前踩过的坑一样。
      - name: 推导计划时刻（延迟守卫）
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          planned=""
          case "$SCHEDULE" in
            '37 7 * * 1-5') planned="1537" ;;
            '7 5 * * 1-5')  planned="1307" ;;
          esac
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"
          if [ -n "$planned" ]; then
            echo "计划时刻：${planned:0:2}:${planned:2} —— 延迟守卫已启用"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::error::cron「$SCHEDULE」在本步骤没有对应时刻，延迟守卫会失效。请同步 on.schedule 与这里的分支。"
            exit 1
          else
            echo "计划时刻：（$EVENT 触发，不做延迟判定）"
          fi

      - name: 运行策略（采集 / 复盘 / 评分 / 推送）
        if: github.event_name != 'push'   # push 触发时数据刚提交过，只负责部署
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "demo" ]; then ARGS="--demo"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.push }}" = "false" ]; then ARGS="$ARGS --no-push"; fi
          python src/run_daily.py $ARGS

      - name: 提交每日快照
        if: github.event_name != 'push'   # 防止「提交→触发→再提交」死循环
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/snapshots
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日策略快照 $(date +'%F %H:%M')"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署 Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # 之前本流程没有任何失败通知：采集全挂时只会静默降级，没人知道。
      - name: 失败告警
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then echo "未配置 FEISHU_WEBHOOK，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 涨停接力任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || true
