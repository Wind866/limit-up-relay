name: 每日涨停接力策略

# 北京时间 = UTC+8。每个交易日跑两次，两次都会推送飞书：
#   13:07 盘中实时快照（UTC 05:07）→ 观察盘中封板与资金变化
#   15:37 收盘定稿（UTC 07:37）→ 次日接力观察池正式版
# 分钟数刻意避开 :00 / :30 —— 整点是 GitHub 调度器最拥堵的时刻。
# 准点由 Cloudflare Worker（见 BIGApush/cloudflare/README.md）workflow_dispatch；
# 下面的 cron 只作兜底。两个档期靠 EXPECT_HHMM 区分，台账守卫按「日期-slot」判重。
on:
  schedule:
    - cron: '7 5 * * 1-5'    # 周一至周五 13:07 北京时间（盘中快照）
    - cron: '37 7 * * 1-5'   # 周一至周五 15:37 北京时间（收盘定稿）
  # 注意：用 GITHUB_TOKEN 提交的 commit 不会再触发工作流，因此本仓库 bot 的
  # 每日快照提交不会走这条兜底；它只对人工 / 外部推送的 docs/data 变更生效。
  # 「真漏跑时不会有数据提交」—— 所以漏跑补推不能依赖 push 事件，
  # 准点由 Cloudflare Worker 负责，事后核对由档期对账任务负责。
  push:
    branches: [main]
    paths:
      - 'docs/data/**'
      - 'data/snapshots/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: false
        default: close
        type: choice
        options:
          - close
          - demo
      force:
        description: '跳过交易日检查 / 本档期已推过也强制再推'
        required: false
        default: false
        type: boolean
      push:
        description: 推送飞书
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: relay-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pages 只是看板，不该阻断飞书推送：未启用时只告警，流程继续。
      - name: 检查 Pages 是否已启用
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages") || code="000"
          if [ "$code" = "404" ]; then
            echo "::warning::GitHub Pages 未启用（不阻断飞书推送）。请到 Settings → Pages → Source 选择「GitHub Actions」。"
          elif [ "$code" = "200" ]; then
            echo "Pages 已启用，继续部署"
          else
            echo "::warning::无法确认 Pages 状态（HTTP $code），继续尝试部署"
          fi

      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 推导看板地址
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          if [ -z "$PAGES_URL" ]; then
            echo "PAGES_URL=$DEFAULT_URL" >> "$GITHUB_ENV"
          fi
          echo "看板地址：${PAGES_URL:-$DEFAULT_URL}"
        env:
          PAGES_URL: ${{ secrets.PAGES_URL }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # 把档期对应的计划时刻写进环境变量，供脚本做延迟标注与双档判重。
      # schedule 触发时直接读 github.event.schedule；外部 Worker 用 workflow_dispatch
      # 触发时该值为空，按当前北京时间取最接近的档期（13:07 / 15:37）。
      - name: 推导计划时刻（档期 / 延迟标注）
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          planned=""
          case "$SCHEDULE" in
            '37 7 * * 1-5') planned="1537" ;;
            '7 5 * * 1-5')  planned="1307" ;;
          esac
          if [ -z "$planned" ] && [ "$EVENT" != "schedule" ]; then
            planned=$(python -c "from datetime import datetime,timezone,timedelta; n=datetime.now(timezone(timedelta(hours=8))); c=n.hour*60+n.minute; print(min(('1307','1537'), key=lambda s: abs(c-int(s[:2])*60-int(s[2:]))))")
          fi
          echo "EXPECT_HHMM=$planned" >> "$GITHUB_ENV"
          if [ -n "$planned" ]; then
            echo "计划时刻：${planned:0:2}:${planned:2} —— 档期守卫已启用"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::error::cron「$SCHEDULE」在本步骤没有对应时刻，双档判重会失效。请同步 on.schedule 与这里的分支。"
            exit 1
          else
            echo "计划时刻：（$EVENT 触发，不做延迟判定）"
          fi

      - name: 运行策略（采集 / 复盘 / 评分 / 推送）
        id: strategy
        if: github.event_name != 'push'   # push 触发时数据刚提交过，只负责部署
        env:
          TZ: Asia/Shanghai
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSH: ${{ inputs.force && '1' || '' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "demo" ]; then ARGS="--demo"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.push }}" = "false" ]; then ARGS="$ARGS --no-push"; fi
          python src/run_daily.py $ARGS

      - name: 提交每日快照
        if: github.event_name != 'push'   # 防止「提交→触发→再提交」死循环
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/snapshots
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日策略快照 $(date +'%F %H:%M')"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: 部署 Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # 业务级失败（数据源降级、飞书漏推）过去被 return 0 吞掉，工作流显示 success，
      # failure() 告警不触发。放在 Pages 部署之后：看板照常更新，最后一步判红并告警。
      - name: 业务健康检查（降级 / 漏推不可静默）
        if: always() && github.event_name != 'push'
        env:
          BUSINESS_OK: ${{ steps.strategy.outputs.business_ok }}
          BUSINESS_ISSUE: ${{ steps.strategy.outputs.business_issue }}
          STRATEGY_RESULT: ${{ steps.strategy.outcome }}
        run: |
          if [ "$STRATEGY_RESULT" != "success" ]; then
            echo "::error::策略脚本执行失败（$STRATEGY_RESULT），详见上方日志"
            exit 1
          fi
          if [ "$BUSINESS_OK" = "false" ]; then
            echo "::error::业务级失败：${BUSINESS_ISSUE:-数据源降级或飞书未推送成功}"
            exit 1
          fi
          echo "业务健康检查通过"

      - name: 失败告警
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "::error::未配置独立告警 Secret ALERT_WEBHOOK；本次告警退回业务 webhook，业务 webhook 故障时告警会一并失效"
          fi
          HOOK="${ALERT_WEBHOOK:-$FEISHU_WEBHOOK}"
          if [ -z "$HOOK" ]; then echo "::error::未配置告警 webhook，跳过失败告警"; exit 0; fi
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ 涨停接力任务运行失败，请查看日志：$RUN_URL\"}}" \
            >/dev/null || echo "::error::告警发送失败（独立告警通道可能也失效）"
