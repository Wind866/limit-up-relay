name: Keep Alive

# GitHub 会在「公开仓库连续 60 天无仓库活动」时自动禁用定时工作流，
# 且重新激活必须修改 cron 值并提交，普通 commit 不够。这里每周留一次提交，
# 保证 limit-up-relay 不会掉进「漏跑 → 无提交 → 被禁用 → 更不触发」的闭环。
on:
  schedule:
    - cron: '0 17 * * 1'   # UTC 周一 17:00 = 北京周二 01:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-keep-alive
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 记录心跳并裁剪日志
        run: |
          echo "Keep alive at $(date '+%Y-%m-%d %H:%M:%S %Z')" >> .github/keep-alive.log
          tail -n 60 .github/keep-alive.log > .github/keep-alive.log.tmp
          mv .github/keep-alive.log.tmp .github/keep-alive.log

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f：即使 .gitignore 规则被改回 *.log 也能提交，心跳不能因为一条忽略规则而失效
          git add -f .github/keep-alive.log
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: keep alive $(date '+%Y-%m-%d')"
          # 外部提交（人工 / dependabot / 每日快照 bot）可能已推进远端，
          # 单次 push 失败会让本周心跳白跑，进而掉进「60 天无活动禁用 schedule」。
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::推送失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin "$BRANCH" || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 2))
          done
          echo "::error::连续 3 次推送失败，本周心跳未入库"
          exit 1
